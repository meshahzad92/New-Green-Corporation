services:
  - type: web
    name: agrimanage-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard → Environment
      - key: SECRET_KEY
        sync: false          # Set manually in Render dashboard → Environment
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080         # 7 days
