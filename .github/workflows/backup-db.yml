name: Database Backup

# Testing: every 5 minutes. Change to weekly after testing.
# Weekly (Sunday 2 AM PKT): cron: '0 21 * * 6'
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup AWS PostgreSQL to Google Drive
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and dump database
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USERNAME }}
        run: |
          FILENAME="agrimanage_backup_$(date +%Y-%m-%d).dump"
          echo "BACKUP_FILENAME=$FILENAME" >> $GITHUB_ENV

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "📦 Running pg_dump on EC2..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_rsa \
            "$SSH_USER@$SSH_HOST" \
            'cd ~/New-Green-Corporation/backend 2>/dev/null || cd ~/new-green-corporation/backend; DB_URL=$(grep -E "^DATABASE_URL=" .env | head -1 | cut -d= -f2-); pg_dump "$DB_URL" -F c' \
            > "$FILENAME"

          SIZE=$(du -sh "$FILENAME" | cut -f1)
          echo "✅ Database dumped to $FILENAME ($SIZE)"

      - name: Upload to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          # Decode service account credentials
          echo "$GDRIVE_CREDENTIALS" | base64 -d > /tmp/sa.json

          # Install Python google libraries
          pip install -q google-auth google-api-python-client

          python3 << 'PYEOF'
          import os, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          SCOPES = ['https://www.googleapis.com/auth/drive.file']
          creds = service_account.Credentials.from_service_account_file('/tmp/sa.json', scopes=SCOPES)
          service = build('drive', 'v3', credentials=creds)

          filename = os.environ['BACKUP_FILENAME']
          folder_id = os.environ['GDRIVE_FOLDER_ID']

          # Check if file with same name already exists in folder
          query = f"name='{filename}' and '{folder_id}' in parents and trashed=false"
          results = service.files().list(q=query, spaces='drive', fields='files(id)').execute()
          existing = results.get('files', [])

          media = MediaFileUpload(filename, mimetype='application/octet-stream', resumable=True)

          if existing:
              # Overwrite existing file
              file_id = existing[0]['id']
              updated = service.files().update(fileId=file_id, media_body=media).execute()
              print(f"✅ Updated existing backup: {filename} (id: {updated['id']})")
          else:
              # Create new file in the folder
              file_metadata = {'name': filename, 'parents': [folder_id]}
              created = service.files().create(body=file_metadata, media_body=media, fields='id').execute()
              print(f"✅ Created new backup: {filename} (id: {created['id']})")
          PYEOF

      - name: Cleanup
        if: always()
        run: rm -f /tmp/sa.json
