name: Database Backup

# Testing: every 5 minutes. Change to weekly after testing.
# Weekly (Sunday 2 AM PKT): cron: '0 21 * * 6'
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup AWS PostgreSQL to Google Drive
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and dump database
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USERNAME }}
        run: |
          FILENAME="agrimanage_backup_$(date +%Y-%m-%d).dump"
          echo "BACKUP_FILENAME=$FILENAME" >> $GITHUB_ENV

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "📦 Running pg_dump on EC2..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_rsa \
            "$SSH_USER@$SSH_HOST" \
            'cd ~/New-Green-Corporation/backend 2>/dev/null || cd ~/new-green-corporation/backend; DB_URL=$(grep -E "^DATABASE_URL=" .env | head -1 | cut -d= -f2-); pg_dump "$DB_URL" -F c' \
            > "$FILENAME"

          SIZE=$(du -sh "$FILENAME" | cut -f1)
          echo "✅ Database dumped to $FILENAME ($SIZE)"

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Upload to Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          # Write rclone config from secret
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" | python3 -c "
          import sys, json
          conf = json.load(sys.stdin)
          for name, vals in conf.items():
              print(f'[{name}]')
              for k, v in vals.items():
                  if isinstance(v, dict):
                      import json as j
                      print(f'{k} = {j.dumps(v)}')
                  else:
                      print(f'{k} = {v}')
              print()
          " > ~/.config/rclone/rclone.conf

          FOLDER_ID="1Lq2AGqvIMm59sV_f1_986AfZYyNKSBBl"
          FILENAME="${BACKUP_FILENAME}"

          # Copy file to Google Drive (overwrites if same name exists)
          rclone copyto "$FILENAME" "gdrive:AgriManage Backups/$FILENAME" \
            --drive-root-folder-id="$FOLDER_ID" \
            -v

          echo "✅ Backup uploaded to Google Drive: $FILENAME"

      - name: Cleanup
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf
