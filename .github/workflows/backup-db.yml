name: Weekly Database Backup

# Runs every Sunday at 2:00 AM PKT (21:00 UTC Saturday)
on:
  schedule:
    - cron: '0 21 * * 6'
  workflow_dispatch:

jobs:
  backup:
    name: Backup AWS PostgreSQL to Google Drive
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and dump database
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USERNAME }}
        run: |
          FILENAME="agrimanage_backup_$(date +%Y%m%d_%H%M%S).dump"
          echo "BACKUP_FILENAME=$FILENAME" >> $GITHUB_ENV

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "📦 Running pg_dump on EC2..."
          # SSH in, read DATABASE_URL from .env, dump to stdout, capture locally
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_rsa \
            "$SSH_USER@$SSH_HOST" \
            'cd ~/New-Green-Corporation/backend 2>/dev/null || cd ~/new-green-corporation/backend; DB_URL=$(grep -E "^DATABASE_URL=" .env | head -1 | cut -d= -f2-); pg_dump "$DB_URL" -F c' \
            > "$FILENAME"

          SIZE=$(du -sh "$FILENAME" | cut -f1)
          echo "✅ Database dumped to $FILENAME ($SIZE)"

      - name: Upload backup to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: ${{ env.BACKUP_FILENAME }}
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: false
          mimeType: application/octet-stream

      - name: Confirm upload
        run: echo "✅ Backup ${{ env.BACKUP_FILENAME }} uploaded to Google Drive successfully!"
