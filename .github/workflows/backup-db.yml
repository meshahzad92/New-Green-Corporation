name: Database Backup

# Testing: every 5 minutes. Change to weekly after testing.
# Weekly (Sunday 2 AM PKT): cron: '0 21 * * 6'
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup to Google Drive
    runs-on: ubuntu-latest

    steps:
      - name: Export database via app API
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USERNAME }}
        run: |
          FILENAME="agrimanage_backup_$(date +%Y-%m-%d).json"
          echo "BACKUP_FILENAME=$FILENAME" >> $GITHUB_ENV

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "📦 Exporting database via app API on EC2..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/id_rsa \
            "$SSH_USER@$SSH_HOST" bash -s << 'REMOTE' > "$FILENAME"
            TOKEN=$(curl -sf -X POST http://localhost:8000/api/v1/login/access-token \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "username=waris92&password=waris92" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

            curl -sf http://localhost:8000/api/v1/backup/export \
              -H "Authorization: Bearer $TOKEN"
          REMOTE

          SIZE=$(du -sh "$FILENAME" | cut -f1)
          echo "✅ Database exported to $FILENAME ($SIZE)"

          # Verify it's valid JSON
          python3 -c "import json; d=json.load(open('$FILENAME')); print(f'Tables: {list(d.get(\"counts\",{}).keys())}')"

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Upload to Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" | python3 -c "
          import sys, json
          conf = json.load(sys.stdin)
          for name, vals in conf.items():
              print(f'[{name}]')
              for k, v in vals.items():
                  if isinstance(v, dict):
                      import json as j
                      print(f'{k} = {j.dumps(v)}')
                  else:
                      print(f'{k} = {v}')
              print()
          " > ~/.config/rclone/rclone.conf

          FOLDER_ID="1Lq2AGqvIMm59sV_f1_986AfZYyNKSBBl"

          rclone copyto "$BACKUP_FILENAME" "gdrive:AgriManage Backups/$BACKUP_FILENAME" \
            --drive-root-folder-id="$FOLDER_ID" \
            -v

          echo "✅ Backup uploaded to Google Drive: $BACKUP_FILENAME"

      - name: Cleanup
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf
